[project]
name = "kathak-practice-guide"
version = "0.1.0"
description = "Record a guided footwork drill and review its timing."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "audioop-lts>=0.2.1,<0.3; python_version >= '3.13'",
    "mediapipe>=1.0.1,<2.0.0",
    "numpy>=1.26,<3.0",
    "opencv-python>=4.10.0.84,<5.0.0",
    "pydub>=0.25.1,<0.26",
    "pygame-ce>=2.5,<3.0",
]

[dependency-groups]
build = ["pyinstaller>=6.16,<7"]


[tool.uv]
package = false
